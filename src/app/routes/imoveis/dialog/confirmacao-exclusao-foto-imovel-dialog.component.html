<h2 mat-dialog-title>Excluir Foto</h2>
<mat-dialog-content>
  <p>Tem certeza que deseja excluir esta foto do imóvel?</p>
  <p>Observação: Esta ação não poderá ser desfeita</p>
</mat-dialog-content>
<mat-dialog-actions>
    <button mat-button (click)="onNoClick()">Não</button>
    <button mat-button [mat-dialog-close]="data" cdkFocusInitial>Sim</button>
</mat-dialog-actions>
