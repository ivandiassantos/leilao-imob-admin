<h2 mat-dialog-title>{{data.titulo}}</h2>
<mat-dialog-content>
  Tem certeza que deseja {{data.descricao}}
</mat-dialog-content>
<mat-dialog-actions>
    <button mat-button (click)="onNoClick()">Não</button>
    <button mat-button [mat-dialog-close]="data" cdkFocusInitial>Sim</button>
</mat-dialog-actions>
